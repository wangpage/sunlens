[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunlens"
version = "0.0.1"
description = "SunLens 学徒 — 实时记录你操作目标窗口（默认 fnOS NAS），用本地 Ollama qwen3-vl 看懂每一步在做什么（Windows）"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SunLens" }]
keywords = ["fnos", "nas", "screen-capture", "activity-log", "qwen-vl", "ollama", "windows"]

dependencies = [
    # 配置 / 日志
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru",
    # 进程检测（窗口枚举走 ctypes，无需 pywin32）
    "psutil",
    # 图像（截图 PIL.ImageGrab + 压缩）
    "Pillow",
    # HTTP（调用本地 Ollama OpenAI 兼容端点）
    "requests",
    # 主控端鼠标/键盘事件捕获
    "pynput",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sunlens = "engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
